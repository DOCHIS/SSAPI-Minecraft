# ════════════════════════════════════════════════════════════════════
#               SSAPI 메시지 — 채팅·알림에 표시될 문구
# ════════════════════════════════════════════════════════════════════
#  📖 색상과 서식은 MiniMessage 문법을 사용합니다.
#     https://docs.advntr.dev/minimessage/format.html
#
#  💡 원하는 문구와 스타일로 자유롭게 바꿀 수 있습니다. 아래는 예시입니다.
#     <green>초록</green>, <red>빨강</red>, <yellow>노랑</yellow>, <gold>금색</gold>
#     <bold>굵게</bold>, <italic>기울임</italic>, <underlined>밑줄</underlined>
#     <click:run_command:'/API 상태'>[상태 보기]</click>
#     <hover:show_text:'마우스 올리면 보이는 설명'>도움말</hover>
#
#  📌 <player>, <message> 같은 변수는 메시지마다 줄 옆 주석에 적혀 있습니다.
#     변수 이름은 그대로 두고, 위치와 주변 문구는 원하는 대로 조정할 수 있습니다.
# ════════════════════════════════════════════════════════════════════

# 모든 메시지 앞에 prefix 가 자동으로 붙습니다.
# 메시지 본문에 [후원] / [미션] 같은 괄호 prefix 를 다시 넣지 마세요.
# 메시지를 보이지 않게 하려면 값을 빈 문자열 "" 로 두세요.
prefix: "<aqua>[<yellow>SSAPI<aqua>]<reset> "


# ─── 후원 연동 (사용자 본인) ───
api:
  connect_success: "후원 연동이 <green>완료</green>됐어요! <aqua>/API 시작</aqua> 으로 후원 보상 받기를 시작하거나 <aqua>/API 중지</aqua> 로 멈출 수 있어요."
                                                              # 변수: 없음
  connect_fail: "후원 연동 <red>실패</red>: <yellow><message></yellow>"
                                                              # 변수: <message>
  disconnect_success: "후원 연동이 <green>해제</green>됐어요."
                                                              # 변수: 없음
  disconnect_fail: "연동 해제 <red>실패</red>: <yellow><message></yellow>"
                                                              # 변수: <message>
  start: "이제부터 후원 보상을 <green>받을 수 있어요</green>."
                                                              # 변수: 없음
  stop: "후원 보상 받기를 <yellow>잠시 멈춥니다</yellow>."
                                                              # 변수: 없음
  connecting: "후원 연동 중이에요... <gray>잠시만요</gray>."
                                                              # 변수: 없음
  disconnecting: "연동을 해제하는 중이에요... <gray>잠시만요</gray>."
                                                              # 변수: 없음
  not_connected: "먼저 <aqua>/API 연동 <숲|치지직> <아이디></aqua> 명령어로 후원과 연결해 주세요."
                                                              # 변수: 없음
  connect_test: ""                                            # 비워두면 표시 안 됨

  # 동시송출 연동
  simulcast_connect_success: "<yellow><platform_name></yellow> 동시송출 연동을 <green>완료</green>했어요. 두 플랫폼의 후원이 모두 적용돼요."
                                                              # 변수: <platform_name>
  simulcast_connect_fail: "동시송출 연동 <red>실패</red>: <yellow><message></yellow>"
                                                              # 변수: <message>
  simulcast_disconnect_success: "동시송출 연동을 <green>해제</green>했어요. 메인 연동은 그대로 유지됩니다."
                                                              # 변수: 없음
  simulcast_disconnect_fail: "동시송출 해제 <red>실패</red>: <yellow><message></yellow>"
                                                              # 변수: <message>

  # 통신 오류 (사용자가 직접 해결 어려운 오류는 관리자 문의 안내 포함)
  error:
    network: "<yellow>SSAPI 서버</yellow>에 <red>연결할 수 없어요</red>. 인터넷 상태를 확인하고, 계속 발생하면 서버 관리자에게 알려 주세요."
    timeout: "<yellow>SSAPI 서버</yellow> 응답이 <red>너무 오래</red> 걸려요. 잠시 후 다시 시도해 주세요. 반복되면 서버 관리자에게 문의해 주세요."
    auth: "플러그인이 <yellow>SSAPI 서버</yellow>에 <red>인증되지 않았어요</red>. 서버 관리자에게 API 키 설정 확인을 요청해 주세요."
    server: "<yellow>SSAPI 서버</yellow>에 <red>일시적인 문제</red>가 있어요. (코드 <yellow><code></yellow>) 잠시 후 다시 시도하고, 반복되면 서버 관리자에게 알려 주세요."  # 변수: <code>
    schema: "플러그인이 <yellow>SSAPI 서버</yellow> 응답을 <red>이해하지 못했어요</red>. 최신 버전 업데이트가 필요합니다 — 서버 관리자에게 알려 주세요."
    business: "<message>"                                     # 변수: <message>

  # 연동 시 사유 메시지 — connect_fail / disconnect_fail 의 <message> 자리에 채워져 출력됨.
  # "후원 연동 실패: <여기 메시지>" 같이 wrapper 안에 들어가므로
  # 짧은 사유 + 권장 조치 형태로 작성 (wrapper 의 "실패" 단어 중복 X).
  connect:
    error:
      platform_invalid: "지원하는 플랫폼은 <yellow>숲</yellow> 또는 <yellow>치지직</yellow> 입니다"
      enter_soop_id: "숲 스트리머 아이디를 함께 입력해 주세요"
      enter_chzzk_id: "치지직 채널 ID를 함께 입력해 주세요"
      soop_id_invalid: "숲 아이디는 영문 소문자·숫자만 가능해요"
      chzzk_id_invalid: "치지직 채널 주소(URL)의 끝부분 ID를 그대로 복사해 주세요"
      channel_info_fail: "<yellow><platform_name></yellow> 채널 정보를 찾지 못했어요. 아이디를 확인해 주세요"  # 변수: <platform_name>
      streamer_limit_exceeded: "등록 가능한 스트리머 수를 모두 사용했어요. 서버 관리자에게 슬롯 정리를 요청해 주세요"
      already_connected: "이미 이 마크 계정에 후원 연동이 있어요. <aqua>/API 상태</aqua> 로 확인해 주세요"
      already_connected_same_id: "이미 <green>성공적으로 연동된 아이디</green>예요. <aqua>/API 상태</aqua> 로 확인해 주세요"
      streamer_already_registered: "이미 다른 마크 계정에 연동된 채널이에요. 기존 연동을 먼저 해제해 주세요"
      streamer_uppercase_forbidden: "아이디는 영문 소문자만 입력해 주세요"
      streamer_special_chars: "아이디에 특수문자가 들어있어요. 영문 소문자·숫자·-_ 만 사용해 주세요"
      streamer_not_found: "해당 아이디의 스트리머를 찾을 수 없어요. 오타를 확인해 주세요"
      streamer_not_registered: "아직 연동되지 않은 스트리머예요"
      invalid_input: "입력값을 다시 확인해 주세요"

      # 동시송출 연동 전용
      primary_required_first: "먼저 <aqua>/API 연동</aqua> 으로 메인 연동을 해주세요"
      same_platform_as_primary: "메인에 이미 같은 플랫폼이 연동되어 있어요. 다른 플랫폼만 동시송출에 추가할 수 있어요"
      simulcast_already_set: "이미 동시송출 연동이 있어요. <aqua>/API 동시송출해제</aqua> 후 다시 시도해 주세요"


# ─── 관리자 명령 (/API관리) ───
admin:
  no_permission: "이 명령어를 사용할 <red>권한이 없어요</red>."
  reload_success: "설정을 <green>다시 불러왔어요</green>."
  reload_fail: "설정 파일에 <red>문제</red>가 있어 다시 불러오지 못했어요. (<yellow><error></yellow>)"  # 변수: <error>
  player_not_found: "<aqua><player></aqua> 플레이어를 <red>찾을 수 없어요</red>. 접속 중인지 확인해 주세요."  # 변수: <player>
  player_only: "이 명령어는 <yellow>게임 안에서만</yellow> 쓸 수 있어요."
  number_required: "<yellow><field></yellow>(은)는 숫자로 입력해 주세요."  # 변수: <field>
  unknown: "<yellow><input></yellow> 명령어가 뭐예요? <click:suggest_command:'/API관리 도움말'><gold><underlined>[도움말 보기]</underlined></gold></click>"  # 변수: <input>
  deprecated_alias: "<yellow><old></yellow> 명령어는 곧 없어질 예정이에요. 다음부터는 <aqua><new></aqua> 를 사용해 주세요."  # 변수: <old>, <new>

  # /API관리로 다른 플레이어 연동/시작/중지
  connect:
    success: "<aqua><player></aqua> 님의 후원 연동을 <green>완료</green>했어요."
    fail: "<aqua><player></aqua> 님의 후원 연동에 <red>실패</red>했어요."
  connection_delete:
    success: "<yellow><target></yellow> 연동 정보 <green><count>개</green>를 삭제했어요."
    partial_fail: "<yellow><target></yellow> 연동 정보 <green><success>개</green> 삭제, <red><failed>개</red> 실패: <yellow><reason></yellow>"
    fail: "<yellow><target></yellow> 연동 정보 삭제 <red>실패</red>: <yellow><reason></yellow>"
    not_found: "<yellow><target></yellow> 와 연결된 연동 정보를 찾지 못했어요."
  disconnect:
    success: "<aqua><player></aqua> 님의 후원 연동을 <green>해제</green>했어요."
    fail: "<aqua><player></aqua> 님의 연동 해제에 <red>실패</red>했어요."
  start: "<aqua><player></aqua> 님의 후원 보상 받기를 <green>시작</green>했어요."
  stop: "<aqua><player></aqua> 님의 후원 보상 받기를 <yellow>중지</yellow>했어요."


# ─── 테스트 명령 (/API테스트) ───
test:
  success: "<aqua><player></aqua> 님에게 <yellow><action></yellow> 을(를) <green>실행</green>했어요."  # 변수: <player>, <action>
  amount_success: "<aqua><player></aqua> 님에게 <gold><amount>원</gold> 후원에 설정된 <yellow><action></yellow> 을(를) <green>실행</green>했어요."  # 변수: <player>, <amount>, <action>
  no_action_for_amount: "이 금액에는 <red>설정된 동작이 없어요</red>."
  invalid_input: "<red>액션 이름이나 금액</red>을 정확히 입력해 주세요."
  available_actions: "<gray>사용 가능한 액션:</gray> <yellow><list></yellow>"  # 변수: <list>


# ─── 후원 알림 (donation 트리거 발동 시 채팅에 표시) ───
donation:
  format: "<aqua><donator></aqua> 님이 <green><amount_formatted>원</green> 후원하셨습니다!"
                                                              # 변수: <donator>, <amount>, <amount_formatted>, <cnt>,
                                                              #       <streamer_id>, <streamer_nickname>, <platform>,
                                                              #       <platform_name>, <message>, <donation_type>


# ─── 미션 알림 (mission 트리거 발동 시 채팅에 표시) ───
mission:
  # 받을 때 (receive phase)
  receive:
    challenge_gift: "<aqua><donator></aqua> 님이 도전미션 '<mission_title>' 에 <green><amount_formatted>원</green> 후원하셨습니다!"
                                                              # 변수: <donator>, <amount>, <amount_formatted>, <cnt>,
                                                              #       <mission_title>, <mission_key>, <mission_type>, <mission_kind>
    gift: "<aqua><donator></aqua> 님이 대결미션 '<mission_title>' 에 <green><amount_formatted>원</green> 후원하셨습니다!"
    chzzk_mission: "<aqua><donator></aqua> 님이 미션 '<mission_title>' 을 시작했습니다. (<green><amount_formatted>원</green>)"
    chzzk_participation: "<aqua><donator></aqua> 님이 미션 '<mission_title>' 에 참여 후원했습니다. (<green><amount_formatted>원</green>)"

  # 정산할 때 (settle phase)
  settle:
    challenge: "도전미션 '<mission_title>' 정산 — 총 <green><total_amount_formatted>원</green> · 후원자 <yellow><donor_count>명</yellow>"
                                                              # 변수: <mission_title>, <total_amount>, <total_amount_formatted>,
                                                              #       <total_cnt>, <donor_count>, <streamers>, <donors_summary>
    battle: "대결미션 '<mission_title>' 정산 — 총 <green><total_amount_formatted>원</green> · 후원자 <yellow><donor_count>명</yellow>"
    top_donor: "최대 후원자: <gold><top_donor_name></gold> (<green><top_donor_amount>원</green>)"
                                                              # 변수: <top_donor_name>, <top_donor_amount>

  # 결과 메타 (result phase — 대결 변수는 대결미션에서만 채워짐)
  result:
    challenge: "도전미션 '<mission_title>' 결과: <yellow><mission_status></yellow>"
                                                              # 변수: <mission_title>, <mission_status>, <mission_key>
    battle: "대결미션 '<mission_title>' — 승자: <gold><winner></gold> · 패자: <gray><loser></gray> (순위: <rank>)"
                                                              # 변수: <mission_title>, <winner>, <loser>, <rank>, <draw>, <my_team_name>
    draw: "대결미션 '<mission_title>' 무승부!"                # 변수: <mission_title>


# ─── 액션 실행 결과 (스트리머 본인 화면) ───
