    inventory_full: "<yellow>인벤토리가 가득 차 일부 아이템이 바닥에 떨어졌습니다."

  random_effect:
    selection_title: "<gold>당첨!"
    selection_searching: "<gray>선택 중..."
    applied: "<green>효과 '<effect>' 가 적용되었습니다."      # 변수: <effect>, <duration_ticks>, <amplifier>
    no_effect_available: "<red>적용 가능한 효과가 없습니다."
    effects:
      positive:
        SPEED: "<green>[버프]<reset> 신속"
        FAST_DIGGING: "<green>[버프]<reset> 성급함"
        INCREASE_DAMAGE: "<green>[버프]<reset> 힘"
        JUMP: "<green>[버프]<reset> 점프 강화"
        REGENERATION: "<green>[버프]<reset> 재생"
        DAMAGE_RESISTANCE: "<green>[버프]<reset> 저항"
        FIRE_RESISTANCE: "<green>[버프]<reset> 화염 저항"
        WATER_BREATHING: "<green>[버프]<reset> 수중 호흡"
        INVISIBILITY: "<green>[버프]<reset> 투명화"
        NIGHT_VISION: "<green>[버프]<reset> 야간 투시"
