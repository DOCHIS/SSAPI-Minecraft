name: SSApi
version: '${version}'
main: kr.ssapi.minecraft
api-version: '1.20'
author: Dochis
description: SOOP / 치지직 후원 · 미션을 마인크래프트 액션으로 연동

commands:
  api:
    description: API 연동 명령어 (사용자)
    usage: |
      /<command> 연동 <숲|치지직> <아이디>          - 후원 연동 (메인)
      /<command> 동시송출연동 <숲|치지직> <아이디>   - 동시송출 추가 연동
      /<command> 동시송출해제                      - 동시송출 연동 해제
      /<command> 시작                              - 후원 보상 받기 시작
      /<command> 중지                              - 후원 보상 받기 중지
      /<command> 상태                              - 내 연동 상태 조회
    aliases:
      - API
      - 후원
  api관리:
    description: API 관리 명령어 (관리자)
    usage: |
      /<command>                                    - GUI 열기
      /<command> 도움말 [페이지]                     - 페이지네이션 도움말
      /<command> 상태                                - 소켓 연결 상태 / 통계
      /<command> 리로드                              - 설정 다시 불러오기
      /<command> 저장                                - 메모리 상태 디스크에 flush
      /<command> 디버그 <on|off>                     - 디버그 로깅 토글
      /<command> 시작 <플레이어>                     - 플레이어 보상 받기 시작
      /<command> 중지 <플레이어>                     - 플레이어 보상 받기 중지
      /<command> 연동 <플레이어> <숲|치지직> <아이디>  - 플레이어 메인 연동
      /<command> 동시송출연동 <플레이어> <숲|치지직> <아이디> - 플레이어 동시송출 연동
      /<command> 동시송출해제 <플레이어>             - 플레이어 동시송출 해제
      /<command> 연동정보삭제 <스트리머아이디|마크아이디> - 연동 정보 강제 삭제
      /<command> 킷 <목록|편집|지급>                 - 킷 관리 (GUI 권장)
      /<command> 트리거 <목록|토글>                  - 트리거 관리 (GUI 권장)
      /<command> 미션                                - 미션 설정 확인 (대시보드 링크)
      /<command> 설정 <검증|복구|백업|원본>          - 설정 파일 관리
    permission: ssapi.admin
    aliases:
      - API관리
      - 후원관리
  api테스트:
    description: 후원 / 미션 액션 테스트 (관리자)
    usage: |
      /<command> <금액|액션명> [플레이어]                          - 후원 synthetic
      /<command> 미션 receive [금액] [플레이어]                    - 미션 receive synthetic
      /<command> 미션 settle [총금액] [후원자수] [플레이어]         - 미션 settle synthetic
      /<command> 미션 result [플레이어]                            - 미션 result synthetic
      /<command> 트리거 <id> [플레이어]                            - 특정 트리거 직접 발동
    permission: ssapi.admin
    aliases:
      - API테스트
      - 후원테스트

permissions:
  ssapi.use:
    description: 기본 사용 권한 (도움말, 상태)
    default: true
  ssapi.admin:
    description: API 전체 관리 권한
    default: op
    children:
      ssapi.command.connect: true
      ssapi.command.start: true
      ssapi.command.stop: true
      ssapi.command.status: true
      ssapi.command.connection_delete: true
      ssapi.command.reload: true
      ssapi.command.save: true
      ssapi.command.test: true
      ssapi.command.debug: true
      ssapi.kit.give: true
      ssapi.kit.edit: true
      ssapi.trigger.view: true
      ssapi.trigger.edit: true
      ssapi.mission.settings: true
      ssapi.gui: true
      ssapi.config.read: true
      ssapi.config.write: true
  ssapi.command.connect:
    description: 다른 플레이어 연동
    default: op
  ssapi.command.start:
    description: 다른 플레이어 보상 시작
    default: op
  ssapi.command.stop:
    description: 다른 플레이어 보상 중지
    default: op
  ssapi.command.status:
    description: 시스템 상태 조회
    default: op
  ssapi.command.connection_delete:
    description: 스트리머/마크 아이디 기준 연동 정보 강제 삭제
    default: op
  ssapi.command.reload:
    description: 설정 리로드
    default: op
  ssapi.command.save:
    description: 메모리 상태 저장
    default: op
  ssapi.command.test:
    description: 테스트 이벤트 발동
    default: op
  ssapi.command.debug:
    description: 디버그 모드 토글
    default: op
  ssapi.kit.give:
    description: 킷 지급
    default: op
  ssapi.kit.edit:
    description: 킷 편집
    default: op
  ssapi.trigger.view:
    description: 트리거 조회
    default: op
  ssapi.trigger.edit:
    description: 트리거 편집
    default: op
  ssapi.mission.settings:
    description: 미션 설정 확인
    default: op
  ssapi.gui:
    description: GUI 열기
    default: op
  ssapi.config.read:
    description: 설정 읽기
    default: op
  ssapi.config.write:
    description: 설정 쓰기
    default: op
