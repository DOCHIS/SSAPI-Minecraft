# ════════════════════════════════════════════════════════════════════
#                  SSAPI Minecraft Plugin v2 — 메인 설정
# ════════════════════════════════════════════════════════════════════
#  📖 사용 가이드:  https://ssapi.kr/docs/minecraft
#  🐛 버그 신고:    https://github.com/.../issues
#  💬 디스코드:     https://discord.gg/...
#
#  💡 자주 묻는 질문:
#   - "후원 금액별로 다른 동작을 하고 싶어요" → triggers.yml 참고
#   - "킷(아이템 묶음)을 만들고 싶어요"      → 게임 안에서 /API관리 입력
#   - "메시지 문구를 바꾸고 싶어요"          → messages.yml 참고
#   - 이 파일을 수정한 다음엔 /API관리 리로드 명령으로 적용해 주세요
#
#  ⚠️ 이 파일의 주석은 사라지지 않아요. 마음대로 메모 남기셔도 됩니다.
# ════════════════════════════════════════════════════════════════════

# 설정 파일 버전 — 손대지 마세요. 플러그인이 자동으로 관리합니다.
config-version: 2


# ─────────────────────────────────────────────────────────────────────
# [1] API 연동
# ─────────────────────────────────────────────────────────────────────
api:
  # API 키 (대시보드에서 발급) — 이 값이 비어있으면 플러그인이 동작하지 않습니다.
  # 발급 방법: https://ssapi.kr/app/applications/new
  key: ""

  # 채팅창에 보일 머리말 (예: [SSAPI])
  prefix: "<aqua>[<yellow>SSAPI<aqua>]<reset> "

  # SSAPI 서버 주소 — 변경하지 마세요 (개발/테스트 외 용도)
  servers:
    socket: "https://socket.ssapi.kr"
    api:    "https://api.ssapi.kr"

  # 인터넷 연결 관련
  socket:
    timeout_ms:           3000      # 서버 연결 시도 시간 (밀리초). 1000~5000 권장
    reconnect:            true      # 연결이 끊기면 자동으로 다시 연결할까요?
    reconnect_delay_ms:   1000      # 다시 연결까지 기다리는 시간 (밀리초)
    reconnect_max_delay_ms: 30000   # 최대 대기 시간
    reconnect_max_attempts: 10000   # 다시 시도 횟수. -1 로 두면 계속 시도


# ─────────────────────────────────────────────────────────────────────
# [2] 데이터 저장 방식
# ─────────────────────────────────────────────────────────────────────
storage:
  # 어디에 저장할까요?
  #   yml   : 파일 (소규모 서버 추천)
  #   mysql : MySQL DB (큰 서버 / 여러 서버 추천)
  type: "yml"

  # MySQL 쓸 때만 채워주세요
  mysql:
    host: "localhost"               # DB 주소 (영문/숫자/./- 만 가능)
    port: 3306
    database: "ssapi"
    username: "ssapi"
    password: ""                    # 비밀번호 비우면 플러그인이 켜지지 않습니다
    pool:
      maximum_pool_size: 10         # 동시에 열어둘 DB 연결 최대 개수
      minimum_idle:      5
      idle_timeout_ms:   300000     # 5분 동안 안 쓰면 정리
      max_lifetime_ms:   1800000    # 한 연결 최대 30분 후 재사용
      connection_timeout_ms: 30000  # 연결 시도 시간


# ─────────────────────────────────────────────────────────────────────
# [3] 미션 (도전 / 대결미션)
# ─────────────────────────────────────────────────────────────────────
# 미션 활성화·시점은 대시보드(https://ssapi.kr) 에서 바꿉니다.
# 이 파일에서는 플러그인 측 정산 처리 방식만 조정합니다.
#
# 💡 동시에 여러 미션이 진행 중이면 각 미션 별로 따로 처리됩니다.
#    (mission_key 로 미션이 구분되며, 트리거·정산도 각 미션 별로 독립 발동)
mission:
  # 정산(settle) 시점에 미션의 후원들을 어떻게 처리할까요?
  #
  #   combined   : 미션에 들어온 모든 후원의 금액을 합쳐서 트리거 1회 발동 (기본)
  #                예) 후원자 10명이 각자 후원 → 총 100,000원으로 트리거 1번
  #
  #   individual : 미션에 들어온 후원 하나하나를 따로 트리거 발동
  #                예) 후원자 10명이 각자 후원 → 각 후원 금액으로 10번 트리거
  #                ※ donors[] 배열을 시간순으로 순회하며 매번 트리거 매칭
  #
  # ※ 이 옵션은 settle 시점에만 적용됩니다.
  #   receive / result 시점은 어차피 개별 후원이 그때그때 들어오므로 무관합니다.
  settle_payout: "combined"

  # individual 모드에서 후원자가 너무 많으면 처리 부하 방지
  payout_safety:
    max_donors_processed: 200    # 한 미션에서 처리할 최대 후원자 수 (초과분은 무시)
    tick_spacing: 4              # 후원자 간 처리 간격 (20틱 = 1초). individual 일 때만 의미

  # 미션 시점별 액션
  # ─ 사용 가능한 액션 타입·변수는 triggers.yml 헤더 주석 참조
  # ─ enabled: false 면 매칭에서 제외 (기본 false, 필요한 것만 켜기)
  # ─ 시점은 대시보드에서 활성화한 것만 발동됨

  # ▸ on_receive: 들어온 미션 후원 한 건당 트리거 매칭 (donation 과 동일)
  #   match.amount = 후원 amount
  on_receive:
    - id: receive_default
      enabled: false
      match: { op: any }
      priority: 0
      stop_on_match: false
      actions:
        - type: command
          lines:
            - "broadcast §6{donator_name}§f님이 미션 §e{mission_title}§f 발동!"

  # ▸ on_settle: 정산 시점 트리거 매칭
  #   match.amount = settle_payout=combined → 총 합산 금액 / individual → 각 후원자 금액
  on_settle:
    # 작은 미션 (~10만원)
    - id: small_settle
      enabled: false
      match: { op: range, min: 1000, max: 99999 }
      priority: 100
      stop_on_match: false
      actions:
        - type: command
          lines: ["broadcast {mission_title} 정산: {total_amount_formatted}원"]

    # 중간 미션 (10만~100만)
    - id: mid_settle
      enabled: false
      match: { op: range, min: 100000, max: 999999 }
      priority: 50
      stop_on_match: true
      actions:
        - { type: give_kit, kit: mission_mid_kit }
        - { type: spawn_mob }

    # 큰 미션 (100만 이상) → VIP 보상
    - id: big_settle
      enabled: false
      match: { op: gte, value: 1000000 }
      priority: 10
      stop_on_match: true
      actions:
        - { type: give_kit, kit: mission_vip_kit }
        - type: command
          lines: ['title @a title "{mission_title} 대규모 정산!"']

  # ▸ on_result: 미션 결과 메타가 들어왔을 때
  #   금액 정보가 없어 match 는 항상 op:any 만 의미 있음.
  #   변수: {mission_status} (SUCCESS/FAILURE/DRAW),
  #         {winner}, {loser}, {rank}, {draw}, {my_team_name} (대결미션에서만 채워짐)
  on_result:
    - id: result_default
      enabled: false
      match: { op: any }      # on_result 는 op:any 만 사용
      priority: 0
      stop_on_match: false
      actions:
        - type: command
          lines: ["broadcast §e{mission_title}§f 결과: §6{mission_status}§f"]


# ─────────────────────────────────────────────────────────────────────
# [4] 보상 지급 정책
# ─────────────────────────────────────────────────────────────────────
reward:
  # 후원·미션이 들어왔는데 플레이어가 미접속 상태이면 어떻게 할까요?
  #   false → 무시 (기본값, 안전)
  #   true  → 접속 여부 상관없이 즉시 실행
  #
  # ⚠️ true 로 켜면 알아두실 점:
  #  - 인벤토리 지급(give_kit) / 텔레포트 / 즉사 같은 player 의존 액션은 플레이어가 없어 자연 실패합니다
  #  - command 액션은 콘솔에서 실행되므로 정상 작동합니다 (실제 사용 가치는 여기에 있음)
  #
  # ⚠️ 마인크래프트 기본 `give` 명령어는 오프라인 플레이어에게 동작하지 않습니다.
  #    EssentialsX `/mail send` 또는 ItemsAdder 우편함 같은
  #    **별도 선물함 플러그인이 설치되어 있을 때만** 의미 있는 옵션입니다.
  #    이 경우 command 액션을 우편함 명령어로 작성하세요.
  #
  # ⚠️ Velocity / BungeeCord 같은 프록시 환경에서 true 로 켜면 추가 주의:
  #    여러 서브 서버에 같은 플러그인이 깔려 있으면 모든 서버에서 발동되어
  #    보상이 중복 지급될 수 있습니다. (단일 서버 환경에서는 안전합니다)
  execute_when_offline: false


# ─────────────────────────────────────────────────────────────────────
# [5] 액션 세부 설정 (후원 / 미션 / 연동 모든 트리거 공통)
# ─────────────────────────────────────────────────────────────────────
actions:
  give_kit:
    # 킷을 줬는데 인벤토리가 꽉 차 있으면?
    #   true  → 바닥에 떨어뜨려요
    #   false → 그냥 무시 (아이템이 사라집니다)
    drop_overflow: true

  spawn_mob:
    # 어떤 종류의 몹이 소환될 수 있나?
    enabled:
      passive: true       # 평화로운 동물 (소, 양, 돼지 등)
      neutral: true       # 중립 (늑대, 벌, 엔더맨 등)
      hostile: true       # 적대 (좀비, 스켈레톤 등)
      boss:    false      # 보스 (위더, 엔더드래곤). 위험하니 기본 OFF
    # 몹 강도: 1(아주 약함) ~ 5(아주 강함). 3 이 보통.
    # 1~5 외의 값은 사용할 수 없습니다.
    difficulty: 3

  random_effect:
    positive_effects: true   # 이로운 효과 (속도 증가, 재생 등)
    negative_effects: true   # 해로운 효과 (느림, 독 등)
    duration_ticks:   200    # 효과가 얼마나 오래 지속될지 (20틱 = 1초, 200 = 10초)
    amplifier:        1      # 효과 강도 (0=I, 1=II, 2=III)

  random_teleport:
    # 텔레포트할 수 있는 좌표 범위
    range:
      x: { distance_min: 3000, distance_max: 6000, world_min: -30000, world_max: 30000 }
      z: { distance_min: 3000, distance_max: 6000, world_min: -30000, world_max: 30000 }
      # distance_min 은 반드시 distance_max 보다 작아야 해요
      y:
        # 안전한 Y 위치를 찾는 방향
        #   BOTTOM_TO_TOP → 아래에서 위로 (지하부터 탐색)
        #   TOP_TO_BOTTOM → 위에서 아래로 (지상부터 탐색)
        search_direction: "BOTTOM_TO_TOP"
        world_min: 0
        world_max: 256
    safe_zone:
      allow_water: true       # 물 위로 텔레포트해도 OK?
      allow_lava:  false      # 용암 위는 위험하니 기본 차단
      allow_solid: false      # 블록 안에 박히는 것 차단
    search:
      max_attempts:  15       # 안전한 위치를 몇 번이나 시도해볼지
      retry_delay_ms: 2000    # 시도 사이 간격

  instant_death:
    # 즉사 액션 시 인벤토리 보호 여부
    #   true  → 아이템이 떨어지지 않고 그대로 보관됩니다
    #   false → 평소처럼 아이템이 떨어집니다
    protect_inventory: true


# ─────────────────────────────────────────────────────────────────────
# [6] 알림 사운드 켜기/끄기
# ─────────────────────────────────────────────────────────────────────
# 채팅 메시지 자체는 messages.yml 에서 직접 수정하거나 비우면 안 표시됩니다.
# 여기서는 액션 발동 시 들리는 효과음만 켜고 끄는 옵션을 둡니다.
sounds:
  donation:        true     # 후원 들어왔을 때 효과음
  mission:         true     # 미션 들어왔을 때 효과음
  give_kit:        true     # 킷 지급 효과음
  spawn_mob:       true     # 몹 소환 효과음
  random_effect:   true     # 랜덤 효과 적용 효과음
  random_teleport: true     # 랜덤 텔레포트 효과음
  instant_death:   true     # 즉사 효과음


# ─────────────────────────────────────────────────────────────────────
# [7] 기록 (로그)
# ─────────────────────────────────────────────────────────────────────
  logging:
    enabled: true
    save:
      api:      true            # SSAPI REST API 호출/응답 기록
      donation: true            # 후원이 들어왔을 때 기록
      mission:  true            # 미션이 들어왔을 때 기록
      failure:  true            # 액션 실패했을 때 기록 (문제 추적용)
  # 자세한 디버그 출력. 평소엔 OFF, 문제 추적 시에만 ON.
  # 게임 안에서 /API관리 디버그 on 으로 잠깐 켤 수도 있어요.
  debug: false


# ─────────────────────────────────────────────────────────────────────
# [8] 통계 / 업데이트 알림
# ─────────────────────────────────────────────────────────────────────
metrics:
  # bStats 에 익명 통계 보내기 (서버 수, MC 버전 분포 등).
  # 개인정보는 수집되지 않아요. 끄려면 false.
  enabled: true

update_check:
  # 새 버전이 나오면 OP 가 접속할 때 알림
  enabled: true
