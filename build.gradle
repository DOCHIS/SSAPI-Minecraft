plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'kr.ssapi'
version = '2.0.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    implementation 'org.json:json:20240303'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
    implementation 'io.socket:socket.io-client:2.1.1'
    implementation 'io.socket:engine.io-client:2.1.0'
    implementation 'org.xerial.snappy:snappy-java:1.1.10.5'
    // configurate-yaml — v2.0 에서는 미사용 (kits/triggers 자동 쓰기에 Bukkit YAML 사용).
    // 향후 헤더 주석 보존 필요 시 도입 예정.
    implementation 'org.bstats:bstats-bukkit:3.2.1'
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    minimize {
        exclude(dependency('org.json:json:.*'))
        exclude(dependency('org.bstats:.*'))
    }
    // 다른 플러그인과 충돌 방지를 위한 relocation
    relocate 'org.bstats', 'kr.ssapi.libs.bstats'
}

tasks.build.dependsOn tasks.shadowJar
